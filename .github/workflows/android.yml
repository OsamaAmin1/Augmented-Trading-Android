name: Build Android debug APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Accept Android SDK licenses and install API 35
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify embedded runtime and database
        run: python tools/build_preflight.py
      - name: Compile debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-build.log
      - name: Verify APK signature and metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: augmented-trading-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
